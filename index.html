<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Taalbrug Portaal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap">
<style>
/* Layout: marketing pages get a top nav; the portal is an app shell (sidebar + focused canvas). Signature: the learning path, lesson nodes on a winding route from A0 to A2. */
:root{
  --bg:#F3F4F9; --surface:#FFFFFF; --surface-2:#FAFAFD; --sunken:#ECEEF5;
  --ink:#16143A; --ink-2:#5B5978; --ink-3:#8C8AA6; --line:#E3E3EE; --line-2:#D3D3E3;
  --iris:#544FD9; --on-iris:#FFFFFF; --iris-soft:#ECEBFD; --iris-ink:#3B36B8;
  --brand:#FF6B3D; --on-brand:#1A0C06; --brand-soft:#FFEDE5; --brand-ink:#B5390F;
  --mint:#12A27B; --on-mint:#FFFFFF; --mint-soft:#DFF5EE; --mint-ink:#0C7258;
  --sun:#FFC23D; --sun-soft:#FFF4D8; --sun-ink:#7A5200;
  --bad:#D2452F; --bad-soft:#FDE8E4; --bad-ink:#A3301B;
  --hero:#16143A; --hero-2:#25225A; --hero-3:#34307A; --hero-fg:#FFFFFF; --hero-mute:#BDBBDD;
  --bar-muted:#C9C8DD;
  --shadow:0 1px 2px rgba(22,20,58,.05),0 10px 30px -14px rgba(22,20,58,.20);
  --shadow-lg:0 2px 4px rgba(22,20,58,.06),0 28px 60px -24px rgba(22,20,58,.35);
  --f-display:'Sora','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-body:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
  --r:22px; --r-md:16px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0C1D; --surface:#171630; --surface-2:#1B1A37; --sunken:#121128;
  --ink:#F1F0FA; --ink-2:#AEACCB; --ink-3:#7E7CA3; --line:#2A2848; --line-2:#37355A;
  --iris:#8E8AFF; --on-iris:#0D0C1D; --iris-soft:#25234D; --iris-ink:#BDBAFF;
  --brand:#FF7F55; --on-brand:#1A0C06; --brand-soft:#3B2019; --brand-ink:#FFB79F;
  --mint:#46D1A6; --on-mint:#06231A; --mint-soft:#10352B; --mint-ink:#7FE3C3;
  --sun:#FFCB57; --sun-soft:#3A2F13; --sun-ink:#FFD98A;
  --bad:#FF8A73; --bad-soft:#3C1D18; --bad-ink:#FFB3A5;
  --hero:#1D1A45; --hero-2:#29265E; --hero-3:#383478; --hero-fg:#FFFFFF; --hero-mute:#BDBBDD;
  --bar-muted:#3E3C63;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 28px 60px -24px rgba(0,0,0,.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0C1D; --surface:#171630; --surface-2:#1B1A37; --sunken:#121128;
  --ink:#F1F0FA; --ink-2:#AEACCB; --ink-3:#7E7CA3; --line:#2A2848; --line-2:#37355A;
  --iris:#8E8AFF; --on-iris:#0D0C1D; --iris-soft:#25234D; --iris-ink:#BDBAFF;
  --brand:#FF7F55; --on-brand:#1A0C06; --brand-soft:#3B2019; --brand-ink:#FFB79F;
  --mint:#46D1A6; --on-mint:#06231A; --mint-soft:#10352B; --mint-ink:#7FE3C3;
  --sun:#FFCB57; --sun-soft:#3A2F13; --sun-ink:#FFD98A;
  --bad:#FF8A73; --bad-soft:#3C1D18; --bad-ink:#FFB3A5;
  --hero:#1D1A45; --hero-2:#29265E; --hero-3:#383478; --hero-fg:#FFFFFF; --hero-mute:#BDBBDD;
  --bar-muted:#3E3C63;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 28px 60px -24px rgba(0,0,0,.7);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-0.02em;font-weight:700}
h1{font-size:clamp(2rem,4.6vw,3.4rem);font-weight:800;letter-spacing:-0.035em}
h2{font-size:clamp(1.35rem,2.4vw,1.75rem)}
h3{font-size:1.1rem;letter-spacing:-0.01em}
p{margin:0}
a{color:var(--iris)}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--iris);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.label{font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.sr{position:absolute;left:-9999px}

/* ---------- buttons, chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;border:1px solid transparent;font-weight:700;cursor:pointer;text-decoration:none;font-size:.97rem;transition:transform .12s ease,box-shadow .12s ease,background .12s ease;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--iris);color:var(--on-iris);box-shadow:0 4px 0 -1px color-mix(in srgb,var(--iris) 55%,#000)}
.btn-primary:hover{background:color-mix(in srgb,var(--iris) 90%,#000)}
.btn-brand{background:var(--brand);color:var(--on-brand);box-shadow:0 4px 0 -1px color-mix(in srgb,var(--brand) 60%,#000)}
.btn-mint{background:var(--mint);color:var(--on-mint);box-shadow:0 4px 0 -1px color-mix(in srgb,var(--mint) 55%,#000)}
.btn-bad{background:var(--bad);color:#fff;box-shadow:0 4px 0 -1px color-mix(in srgb,var(--bad) 55%,#000)}
.btn-ghost{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn-ghost:hover{background:var(--sunken)}
.btn-quiet{background:transparent;color:var(--ink-2)}
.btn-quiet:hover{background:var(--sunken);color:var(--ink)}
.btn-sm{min-height:38px;padding:0 14px;font-size:.88rem;border-radius:11px}
.btn-lg{min-height:56px;padding:0 26px;font-size:1.05rem;border-radius:16px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;box-shadow:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:.8rem;font-weight:700;white-space:nowrap}
.p-good{background:var(--mint-soft);color:var(--mint-ink)}
.p-warn{background:var(--sun-soft);color:var(--sun-ink)}
.p-bad{background:var(--bad-soft);color:var(--bad-ink)}
.p-iris{background:var(--iris-soft);color:var(--iris-ink)}
.p-brand{background:var(--brand-soft);color:var(--brand-ink)}
.p-quiet{background:var(--sunken);color:var(--ink-2)}
.lvl{display:inline-grid;place-items:center;min-width:36px;height:26px;padding:0 8px;border-radius:8px;font-weight:800;font-size:.8rem;background:var(--iris-soft);color:var(--iris-ink);font-family:var(--f-display)}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.icon-btn:hover{background:var(--sunken)}
.icon-btn.sm{width:34px;height:34px;border-radius:10px}
.icon-btn.round{border-radius:50%}
.icon-btn.play{width:60px;height:60px;border-radius:50%;background:var(--iris);color:var(--on-iris);border-color:var(--iris)}
.icon-btn.speak{width:52px;height:52px;border-radius:16px;background:var(--iris);color:var(--on-iris);border:0;box-shadow:0 4px 0 -1px color-mix(in srgb,var(--iris) 55%,#000)}
.icon-btn[disabled]{opacity:.35;cursor:default}
.seg{display:inline-flex;background:var(--sunken);border-radius:14px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;min-height:38px;padding:0 14px;border-radius:11px;cursor:pointer;font-weight:700;color:var(--ink-2);font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(22,20,58,.12)}
.lang{display:inline-flex;background:var(--sunken);border-radius:12px;padding:3px;gap:2px}
.lang button{border:0;background:none;min-height:34px;min-width:44px;padding:0 10px;border-radius:9px;font-weight:800;font-size:.8rem;cursor:pointer;color:var(--ink-2)}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(22,20,58,.12)}
.demo{font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--sun-soft);color:var(--sun-ink);padding:5px 10px;border-radius:999px;white-space:nowrap}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:700;font-size:.9rem;border:0;background:none;padding:6px 0;color:var(--ink)}
.switch .tr{width:44px;height:26px;border-radius:999px;background:var(--line-2);position:relative;transition:background .15s;flex:none}
.switch .tr::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch[aria-checked="true"] .tr{background:var(--mint)}
.switch[aria-checked="true"] .tr::after{left:21px}

/* ---------- cards & grids ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;min-width:0;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.stack{display:flex;flex-direction:column;gap:24px}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.stat{display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.stat .k{font-size:.85rem;color:var(--ink-2);font-weight:700}
.stat .v{font-family:var(--f-display);font-size:2.1rem;font-weight:800;letter-spacing:-0.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .n{font-size:.84rem;color:var(--ink-3)}
.stat .ic{position:absolute;right:18px;top:18px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.tbl-wrap{overflow-x:auto;margin-inline:-8px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.94rem;min-width:600px}
th{text-align:left;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:10px 8px;border-bottom:1px solid var(--line)}
td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
.who{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.82rem;flex:none;font-family:var(--f-display)}
.av.c0{background:var(--iris-soft);color:var(--iris-ink)}.av.c1{background:var(--brand-soft);color:var(--brand-ink)}.av.c2{background:var(--mint-soft);color:var(--mint-ink)}.av.c3{background:var(--sun-soft);color:var(--sun-ink)}
.meter{height:10px;border-radius:999px;background:var(--sunken);overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;background:var(--mint)}
.meter.iris i{background:var(--iris)}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-h h1{font-size:clamp(1.7rem,3.4vw,2.4rem)}
.page-h p{margin-top:6px}
.row-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row-item:last-child{border-bottom:0}
.row-item .l{display:flex;flex-direction:column;min-width:0}
.row-item .r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.place{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select.sel{min-height:38px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);padding:0 10px;max-width:220px}

/* ---------- marketing nav ---------- */
.mnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.mnav-in{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink);text-decoration:none}
.brand .mk{width:38px;height:38px;border-radius:12px;background:var(--brand);display:grid;place-items:center;color:var(--on-brand);flex:none}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.2rem;letter-spacing:-0.03em}
.mlinks{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.mlinks button{border:0;background:none;padding:8px 12px;border-radius:10px;font-weight:600;color:var(--ink-2);cursor:pointer;min-height:40px}
.mlinks button:hover{background:var(--sunken);color:var(--ink)}
.mtools{display:flex;gap:10px;align-items:center;margin-left:auto}
.mpage{max-width:1200px;margin:0 auto;padding-inline:20px;padding-block:32px 72px;display:flex;flex-direction:column;gap:72px}
@media (max-width:760px){.mlinks{display:none}.mpage{gap:52px}}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:48px;align-items:center;padding-top:20px}
@media (max-width:960px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero-copy{display:flex;flex-direction:column;gap:22px}
.kicker{align-self:flex-start;display:inline-flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);padding:6px 12px 6px 6px;border-radius:999px;font-weight:700;font-size:.86rem;box-shadow:var(--shadow)}
.kicker span.flag{display:inline-flex;gap:3px;background:var(--sunken);border-radius:999px;padding:3px 8px;font-size:.75rem;font-weight:800}
.hero h1 em{font-style:normal;position:relative;white-space:nowrap;color:var(--ink)}
.hero h1 em::after{content:"";position:absolute;left:-2%;right:-2%;bottom:.04em;height:.32em;background:var(--brand);opacity:.35;border-radius:6px;z-index:-1}
.hero h1{position:relative;z-index:0}
.hero .lead{font-size:1.15rem;color:var(--ink-2);max-width:56ch}
.ctas{display:flex;gap:12px;flex-wrap:wrap}
.trust{display:flex;gap:18px;flex-wrap:wrap;color:var(--ink-2);font-size:.9rem;font-weight:600}
.trust span{display:inline-flex;gap:7px;align-items:center}
.trust svg{color:var(--mint)}
.stage{position:relative;min-height:470px;display:grid;place-items:center}
.stage::before{content:"";position:absolute;inset:6% 4%;border-radius:40px;background:var(--iris-soft);transform:rotate(-3deg)}
.phone{position:relative;width:min(340px,100%);background:var(--surface);border-radius:32px;border:1px solid var(--line);box-shadow:var(--shadow-lg);padding:20px;display:flex;flex-direction:column;gap:16px}
.phone .ptop{display:flex;align-items:center;gap:10px}
.phone .seg-bar{flex:1;height:10px;border-radius:999px;background:var(--sunken);overflow:hidden}
.phone .seg-bar i{display:block;height:100%;width:62%;background:var(--mint);border-radius:999px}
.phone .q{font-family:var(--f-display);font-weight:700;font-size:1.25rem}
.phone .q u{text-decoration:none;border-bottom:3px solid var(--iris);padding:0 10px}
.phone .opts2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.phone .o{border:2px solid var(--line);border-radius:14px;padding:12px;font-weight:700;text-align:center}
.phone .o.ok{border-color:var(--mint);background:var(--mint-soft);color:var(--mint-ink)}
.phone .fbk{background:var(--mint-soft);color:var(--mint-ink);border-radius:16px;padding:12px 14px;font-weight:800;display:flex;gap:8px;align-items:center}
.bubble{position:absolute;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;padding:10px 14px;font-weight:700;display:flex;flex-direction:column;line-height:1.25;z-index:2}
.bubble small{color:var(--ink-3);font-weight:600}
.bubble.b1{top:6%;left:0;border-bottom-left-radius:4px}
.bubble.b2{bottom:10%;right:0;border-bottom-right-radius:4px}
.bubble.b3{top:44%;left:-4%;background:var(--brand);color:var(--on-brand);border:0;flex-direction:row;gap:8px;align-items:center}
.bubble.b3 small{color:var(--on-brand);opacity:.8}
@media (max-width:520px){.bubble.b3{left:0}.bubble.b1{left:2%}}
@media (prefers-reduced-motion: no-preference){.bubble{animation:float 6s ease-in-out infinite}.bubble.b2{animation-delay:-2s}.bubble.b3{animation-delay:-4s}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.sec-h{display:flex;flex-direction:column;gap:10px;max-width:720px}
.sec-h p{font-size:1.08rem;color:var(--ink-2)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:20px;counter-reset:s}
.step{display:flex;flex-direction:column;gap:10px;padding:26px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);position:relative}
.step .n{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;background:var(--ink);color:var(--bg)}
.bento{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:20px}
.bento>*{grid-column:span 2}
.bento .wide{grid-column:span 4}
@media (max-width:960px){.bento{grid-template-columns:minmax(0,1fr)}.bento>*,.bento .wide{grid-column:auto}}
.tile-f{border-radius:var(--r);padding:28px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);background:var(--surface);min-width:0}
.tile-f .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center}
.tile-f.dark{background:var(--hero);color:var(--hero-fg);border-color:var(--hero)}
.tile-f.dark .muted{color:var(--hero-mute)}
.typecloud{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.typecloud span{display:inline-flex;align-items:center;gap:8px;background:var(--hero-2);color:var(--hero-fg);border-radius:999px;padding:7px 12px;font-weight:700;font-size:.86rem}
.typecloud span i{font-style:normal;display:inline-grid;place-items:center;min-width:24px;height:22px;border-radius:6px;background:var(--hero-3);font-size:.72rem;padding:0 4px}
.courses{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}
.course{border-radius:var(--r);background:var(--surface);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.course .top{height:110px;position:relative;display:flex;align-items:flex-end;padding:18px}
.course .top .big{font-family:var(--f-display);font-weight:800;font-size:3rem;letter-spacing:-0.05em;line-height:1;opacity:.95}
.course .body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
.course .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:16px;margin-top:auto}
.course .price{font-family:var(--f-display);font-weight:800;font-size:1.25rem}
.t0{background:var(--iris-soft);color:var(--iris-ink)}.t1{background:var(--brand-soft);color:var(--brand-ink)}.t2{background:var(--mint-soft);color:var(--mint-ink)}
.partner{border-radius:28px;background:var(--hero);color:var(--hero-fg);padding:clamp(28px,5vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:36px;align-items:center}
.partner .muted{color:var(--hero-mute)}
.partner ul{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.partner li{display:flex;gap:12px;align-items:flex-start;background:var(--hero-2);padding:14px 16px;border-radius:16px;font-weight:600}
.partner li svg{flex:none;color:var(--brand);margin-top:3px}
.roles-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:16px}
.rtile{display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;color:var(--ink);transition:transform .15s ease,box-shadow .15s ease}
.rtile:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.rtile .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;margin-bottom:6px}
.rtile .go{color:var(--iris);font-weight:800;font-size:.9rem;margin-top:6px}
.mfoot{border-top:1px solid var(--line);padding-top:22px;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;font-size:.88rem;color:var(--ink-3)}

/* forms */
.form{display:flex;flex-direction:column;gap:24px}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field label,.legend{font-weight:700;font-size:.92rem}
.field input,.field textarea,.field select{min-height:50px;padding:10px 14px;border:1.5px solid var(--line-2);border-radius:14px;background:var(--surface-2);font-size:1rem;width:100%;transition:border-color .12s}
.field textarea{min-height:96px;resize:vertical;line-height:1.5}
.field input:focus,.field textarea:focus,.field select:focus{outline:4px solid var(--iris-soft);border-color:var(--iris)}
.err{color:var(--bad-ink);font-size:.86rem;font-weight:700}
fieldset{border:0;margin:0;padding:0;min-width:0}
.choices{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));margin-top:10px}
.choice{position:relative}
.choice input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.choice span{display:flex;flex-direction:column;gap:2px;min-height:56px;padding:12px 14px;border:1.5px solid var(--line-2);border-radius:14px;background:var(--surface)}
.choice b{font-family:var(--f-display);font-weight:800}
.choice small{color:var(--ink-2);font-size:.84rem}
.choice input:checked + span{border:2px solid var(--iris);background:var(--iris-soft);padding:11.5px 13.5px}
.choice input:focus-visible + span{outline:3px solid var(--iris);outline-offset:2px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;color:var(--ink-2)}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--iris)}
.signup{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:40px;align-items:start}
@media (max-width:900px){.signup{grid-template-columns:minmax(0,1fr)}}
.signup aside{position:sticky;top:100px;display:flex;flex-direction:column;gap:18px}
.signup aside ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px}
.signup aside li{display:flex;gap:12px;align-items:flex-start}
.signup aside li .n{width:30px;height:30px;border-radius:10px;background:var(--iris-soft);color:var(--iris-ink);display:grid;place-items:center;font-weight:800;flex:none}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:22px}
.side .brand{padding:4px 6px}
.viewas{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--sunken);border-radius:14px;padding:4px}
.viewas button{border:0;background:none;border-radius:10px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--ink-2);font-size:.66rem;font-weight:800;letter-spacing:.02em;padding:4px 2px}
.viewas button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(22,20,58,.14)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;border-radius:12px;min-height:46px;padding:0 12px;cursor:pointer;color:var(--ink-2);font-weight:700;text-align:left;font-size:.95rem}
.nav button:hover{background:var(--sunken);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--iris-soft);color:var(--iris-ink)}
.nav button .cnt{margin-left:auto}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;font-size:.85rem}
.side .demo{white-space:normal;text-align:center;line-height:1.3}
.top2>.card{display:flex;align-items:center}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.me b{display:block;font-size:.9rem}
.me small{color:var(--ink-3)}
.canvas{padding:28px clamp(16px,3vw,40px) 72px;min-width:0;display:flex;flex-direction:column;gap:24px;max-width:1280px;width:100%}
@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:auto;flex-direction:row;align-items:center;gap:10px;padding:10px 16px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);flex-wrap:nowrap}
  .side .brand b,.side .me,.side .label,.side-foot .demo{display:none}
  .viewas{grid-template-columns:repeat(4,auto);flex:none}
  .viewas button{min-height:40px;padding:0 10px;flex-direction:row;font-size:.75rem}
  .nav{flex-direction:row;flex:none}
  .nav button{min-height:40px;white-space:nowrap}
  .side-foot{margin:0;flex-direction:row;align-items:center;flex:none}
}

/* ---------- learner dashboard ---------- */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
@media (max-width:1100px){.dash{grid-template-columns:minmax(0,1fr)}}
.hello{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hello .big-av{width:56px;height:56px;border-radius:18px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.4rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 13px;font-weight:800;font-size:.88rem;background:var(--surface);border:1px solid var(--line)}
.chip.fire{background:var(--sun-soft);color:var(--sun-ink);border-color:transparent}
.chip.fire svg{color:var(--brand)}
.top2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px}
@media (max-width:760px){.top2{grid-template-columns:minmax(0,1fr)}}
.cont{position:relative;overflow:hidden;background:var(--hero);color:var(--hero-fg);border-radius:var(--r);padding:28px;display:flex;flex-direction:column;gap:12px;min-height:240px}
.cont::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:34px solid var(--hero-2)}
.cont::before{content:"";position:absolute;right:40px;bottom:-70px;width:140px;height:140px;border-radius:50%;background:var(--brand);opacity:.9}
.cont>*{position:relative;z-index:1}
.cont .label{color:var(--hero-mute)}
.cont h2{font-size:clamp(1.5rem,2.8vw,2.1rem);max-width:18ch}
.cont .muted{color:var(--hero-mute)}
.cont .meta{display:flex;gap:8px;flex-wrap:wrap}
.cont .meta span{background:var(--hero-2);border-radius:999px;padding:5px 11px;font-size:.8rem;font-weight:700}
.goal{display:flex;gap:20px;align-items:center}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .c b{font-family:var(--f-display);font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.ring .c small{font-size:.72rem;color:var(--ink-3);font-weight:700}
.week{display:flex;align-items:flex-end;gap:8px;height:74px;margin-top:6px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;min-width:0}
.week i{display:block;width:100%;max-width:22px;border-radius:6px;background:var(--bar-muted);min-height:4px}
.week .today i{background:var(--mint)}
.week .hit i{background:color-mix(in srgb,var(--mint) 55%,var(--bar-muted))}
.week span{font-size:.66rem;font-weight:800;color:var(--ink-3);text-transform:uppercase}

/* learning path */
.path-card{padding:28px 20px}
.path{display:flex;flex-direction:column;align-items:center;gap:0}
.unit{width:100%;border-radius:20px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:18px 0 26px}
.unit:first-child{margin-top:0}
.unit h3{font-size:1.2rem}
.unit .l{display:flex;flex-direction:column;gap:2px}
.unit .l small{font-weight:700;opacity:.8}
.unit.u0{background:var(--iris);color:var(--on-iris)}
.unit.u1{background:var(--brand);color:var(--on-brand)}
.unit.u2{background:var(--mint);color:var(--on-mint)}
.unit.u3{background:var(--sunken);color:var(--ink-2)}
.unit .score{background:rgba(255,255,255,.22);border-radius:999px;padding:5px 12px;font-weight:800;font-size:.85rem}
.unit.u1 .score{background:rgba(0,0,0,.12)}
.node-row{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:22px;transform:translateX(var(--x,0))}
.node{width:72px;height:68px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;position:relative;background:var(--surface);color:var(--ink-2);box-shadow:0 6px 0 var(--line-2),inset 0 0 0 3px var(--line-2);transition:transform .1s}
.node:active{transform:translateY(3px);box-shadow:0 3px 0 var(--line-2),inset 0 0 0 3px var(--line-2)}
.node svg{width:26px;height:26px}
.node.done{background:var(--mint);color:var(--on-mint);box-shadow:0 6px 0 color-mix(in srgb,var(--mint) 60%,#000)}
.node.cur{background:var(--brand);color:var(--on-brand);box-shadow:0 6px 0 color-mix(in srgb,var(--brand) 60%,#000)}
.node.cur::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid var(--brand);opacity:.35}
@media (prefers-reduced-motion: no-preference){.node.cur::before{animation:pulse 1.8s ease-out infinite}}
@keyframes pulse{0%{transform:scale(.9);opacity:.5}100%{transform:scale(1.25);opacity:0}}
.node.test{border-radius:22px;width:76px}
.node[disabled]{cursor:not-allowed;background:var(--sunken);color:var(--ink-3);box-shadow:0 6px 0 var(--line),inset 0 0 0 3px var(--line)}
.node-cap{text-align:center;max-width:180px;font-size:.84rem;font-weight:700;line-height:1.25}
.node-cap small{display:block;color:var(--ink-3);font-weight:600;font-size:.76rem}
.start-tip{background:var(--surface);border:2px solid var(--brand);color:var(--brand-ink);border-radius:12px;padding:4px 12px;font-weight:800;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;position:relative;margin-bottom:6px}
.start-tip::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:var(--surface);border-right:2px solid var(--brand);border-bottom:2px solid var(--brand);transform:translateX(-50%) rotate(45deg)}
.mini-l{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 12px;min-height:58px;cursor:pointer;color:var(--ink);width:100%}
.mini-l:hover:not([disabled]){border-color:var(--iris)}
.mini-l .ti{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--iris-soft);color:var(--iris-ink);flex:none}
.mini-l.done .ti{background:var(--mint);color:var(--on-mint)}
.mini-l.cur{border:2px solid var(--iris);padding:9px 11px;background:var(--iris-soft)}
.mini-l[disabled]{opacity:.55;cursor:not-allowed}
.mini-l b{display:block;font-size:.9rem;line-height:1.25}
.mini-l small{color:var(--ink-3);font-size:.78rem;font-weight:600}
.feedback-card{background:var(--sun-soft);border-color:transparent}

/* ---------- lesson player ---------- */
.player{max-width:820px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:22px}
.ptop{display:flex;align-items:center;gap:14px}
.pbar{flex:1;display:flex;gap:4px}
.pbar i{flex:1;height:12px;border-radius:999px;background:var(--sunken);overflow:hidden;position:relative}
.pbar i.done{background:var(--mint)}
.pbar i.bad{background:var(--bad)}
.pbar i.cur{background:color-mix(in srgb,var(--mint) 35%,var(--sunken))}
.phead{display:flex;flex-direction:column;gap:6px}
.phead h1{font-size:clamp(1.6rem,3.4vw,2.3rem)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:clamp(20px,4vw,36px);display:flex;flex-direction:column;gap:20px;box-shadow:var(--shadow)}
.qcard .q{font-family:var(--f-display);font-size:clamp(1.3rem,3vw,1.75rem);font-weight:700;letter-spacing:-0.02em;line-height:1.25}
.qtype{display:flex;align-items:center;gap:10px}
.qtype .tag{display:inline-flex;align-items:center;gap:6px;background:var(--iris-soft);color:var(--iris-ink);border-radius:999px;padding:5px 12px;font-weight:800;font-size:.78rem}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.opt{min-height:60px;padding:12px 18px;border-radius:16px;border:2px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:700;color:var(--ink);text-align:left;font-size:1.02rem;box-shadow:0 4px 0 var(--line-2);transition:transform .08s}
.opt:hover:not([disabled]){border-color:var(--iris)}
.opt:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--line-2)}
.opt.sel{border-color:var(--iris);background:var(--iris-soft);box-shadow:0 4px 0 color-mix(in srgb,var(--iris) 45%,var(--line-2))}
.opt.right{background:var(--mint-soft);border-color:var(--mint);color:var(--mint-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--mint) 45%,transparent)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 45%,transparent)}
.opt[disabled]{cursor:default}
.opts.inline{display:flex;flex-wrap:wrap}
.opts.inline .opt{min-height:46px;padding:8px 16px;font-size:.95rem}
.gapline{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-family:var(--f-display);font-size:clamp(1.25rem,3vw,1.6rem);font-weight:700}
.gapline input,.dict{min-height:54px;border:2px solid var(--line-2);border-bottom-width:4px;background:var(--surface-2);border-radius:14px;padding:0 14px;font-weight:700;font-size:1.15rem;font-family:var(--f-body)}
.gapline input{width:min(220px,100%)}
.gapline input:focus,.dict:focus{outline:4px solid var(--iris-soft);border-color:var(--iris)}
.dict{flex:1;min-width:200px}
.built{min-height:64px;border-bottom:2px solid var(--line-2);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.wchip{min-height:46px;padding:0 16px;border-radius:14px;border:2px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:700;color:var(--ink);box-shadow:0 3px 0 var(--line-2);font-size:1rem}
.built .wchip{border-color:var(--iris);background:var(--iris-soft)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.match{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.mitem{min-height:54px;border-radius:14px;border:2px solid var(--line-2);background:var(--surface);font-weight:700;cursor:pointer;padding:8px 14px;text-align:left;color:var(--ink);box-shadow:0 3px 0 var(--line-2)}
.mitem.sel{border-color:var(--iris);background:var(--iris-soft)}
.mitem.right{background:var(--mint-soft);border-color:var(--mint);color:var(--mint-ink);box-shadow:none;opacity:.75}
.mitem.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad-ink)}
.sortlist{display:flex;flex-direction:column;gap:10px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.sw{font-size:1.15rem;font-weight:700;font-family:var(--f-display)}
.sw b{color:var(--iris)}
.clockwrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.clock{color:var(--ink);flex:none}
.say-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.say-row .big-say{font-family:var(--f-display);font-size:clamp(1.3rem,3vw,1.7rem);font-weight:700}
.fbar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:10;border-radius:20px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-lg)}
.fbar.ok{background:var(--mint-soft);border-color:transparent}
.fbar.bad{background:var(--bad-soft);border-color:transparent}
.fbar .msg{display:flex;align-items:center;gap:12px;font-weight:800;min-width:0}
.fbar .msg .bubble-ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.fbar.ok .msg{color:var(--mint-ink)}.fbar.ok .bubble-ic{background:var(--mint);color:var(--on-mint)}
.fbar.bad .msg{color:var(--bad-ink)}.fbar.bad .bubble-ic{background:var(--bad);color:#fff}
.fbar .msg small{display:block;font-weight:600;color:var(--ink-2)}
.summary{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding:20px 0}
.summary .ring{width:150px;height:150px}
.summary .stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:520px}
.summary .stats3 div{border-radius:16px;padding:12px;border:2px solid var(--line)}
.summary .stats3 b{display:block;font-family:var(--f-display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.review-list{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.review-list .rl{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.review-list .rl .d{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none}
.review-list .rl.ok .d{background:var(--mint);color:var(--on-mint)}
.review-list .rl.bad .d{background:var(--bad);color:#fff}
.player-nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* video-like dialogue */
.screen{position:relative;overflow:hidden;background:var(--hero);color:var(--hero-fg);border-radius:28px;aspect-ratio:16/9;max-width:100%;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(16px,3vw,30px)}
.screen::before{content:"";position:absolute;left:-10%;bottom:-40%;width:70%;aspect-ratio:1;border-radius:50%;background:var(--hero-2)}
.screen>*{position:relative}
.screen .top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.screen .tag{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--hero-mute)}
.screen .scene{display:flex;align-items:flex-end;gap:clamp(10px,2vw,20px)}
.persona{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;transition:opacity .2s,transform .2s;opacity:.45}
.persona.on{opacity:1;transform:translateY(-4px)}
.persona .head{width:clamp(46px,8vw,72px);height:clamp(46px,8vw,72px);border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:clamp(1rem,2vw,1.5rem)}
.persona .body{width:clamp(64px,11vw,100px);height:clamp(26px,4vw,40px);border-radius:40px 40px 10px 10px;margin-top:-4px}
.persona.p0 .head,.persona.p0 .body{background:var(--brand);color:var(--on-brand)}
.persona.p1 .head,.persona.p1 .body{background:#8E8AFF;color:#0D0C1D}
.persona small{font-size:.72rem;font-weight:800;color:var(--hero-mute)}
.speech{flex:1;min-width:0;background:#FFFFFF;color:#16143A;border-radius:22px;padding:clamp(12px,2vw,20px);margin-bottom:clamp(30px,5vw,50px)}
.speech .say{font-family:var(--f-display);font-weight:700;font-size:clamp(1rem,2.6vw,1.6rem);line-height:1.25;text-wrap:balance}
.speech .sub{color:#5B5978;font-size:clamp(.82rem,1.6vw,1rem);margin-top:4px}
.screen .prog{height:5px;background:var(--hero-2);border-radius:5px;overflow:hidden}
.screen .prog i{display:block;height:100%;background:var(--brand)}
.ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.transcript{display:flex;flex-direction:column;gap:4px}

const allL=()=>C().flatMap((m,mi)=>m.lessons.map((l,li)=>({l,mi,li,m})));
const ALLV=()=>allL().filter(x=>isLive(x.l));
const num=(mi,li)=>`${mi+1}.${li+1}`;
function findL(id){const x=allL().find(x=>x.l.id===id);if(!x)return null;const def=v=>({value:v,writable:true,configurable:true,enumerable:false});Object.defineProperties(x.l,{mi:def(x.mi),mod:def(x.m),num:def(num(x.mi,x.li))});return x.l;}
const liveLessons=m=>m.lessons.filter(isLive);
const testOf=m=>liveLessons(m).filter(l=>l.type==='test').pop();
const unlocked=mi=>{const m=C()[mi];if(!m||m.soon)return false;if(mi===0)return true;
  if(S.placed){const pr=LV.indexOf(S.placed),mr=LV.indexOf(m.lvl);
    if(pr>=0&&mr>=0){if(mr<pr)return true;if(mr===pr&&C().findIndex(x=>x.lvl===m.lvl&&!x.soon)===mi)return true;}} /* результат теста уровня открывает свой модуль */
  const tst=testOf(C()[mi-1]);return !tst||(S.scores[tst.id]||0)>=70;};
const placedIdx=()=>{if(!S.placed)return 0;const i=C().findIndex(m=>m.lvl===S.placed&&!m.soon);return i<0?0:i;};
const nextOpen=()=>{const all=ALLV(),from=placedIdx();const x=all.find(y=>y.mi>=from&&!S.done[y.l.id]&&unlocked(y.mi))||all.find(y=>!S.done[y.l.id]&&unlocked(y.mi));return x?findL(x.l.id):null;};

const HW=['twaalf','een','twee','drie','vier','vijf','zes','zeven','acht','negen','tien','elf'];
function dutchTime(h,m){const H=k=>HW[((k%12)+12)%12];
  const map={0:`${H(h)} uur`,5:`vijf over ${H(h)}`,10:`tien over ${H(h)}`,15:`kwart over ${H(h)}`,20:`tien voor half ${H(h+1)}`,25:`vijf voor half ${H(h+1)}`,30:`half ${H(h+1)}`,35:`vijf over half ${H(h+1)}`,40:`tien over half ${H(h+1)}`,45:`kwart voor ${H(h+1)}`,50:`tien voor ${H(h+1)}`,55:`vijf voor ${H(h+1)}`};
  return map[m]||`${H(h)} uur ${m}`;}
function clockOpts(it){const right=dutchTime(it.h,it.m);
  const wrongs=it.m===30?[`half ${HW[it.h%12]}`,`kwart over ${HW[it.h%12]}`]:it.m===15?[`kwart voor ${HW[it.h%12]}`,`half ${HW[(it.h+1)%12]}`]:it.m===0?[dutchTime(it.h+1,0),`half ${HW[it.h%12]}`]:[dutchTime(it.h,(it.m+30)%60),dutchTime(it.h+1,it.m)];
  const all=[right,...wrongs.filter(w=>w!==right)].slice(0,3);const rot=(it.h+it.m)%all.length;const opts=all.slice(rot).concat(all.slice(0,rot));return {opts,a:opts.indexOf(right)};}
function clockSvg(h,m){const ha=((h%12)+m/60)*30,ma=m*6;const hand=(a,len,w)=>{const r=a*Math.PI/180;return `<line x1="60" y1="60" x2="${(60+len*Math.sin(r)).toFixed(1)}" y2="${(60-len*Math.cos(r)).toFixed(1)}" stroke="currentColor" stroke-width="${w}" stroke-linecap="round"/>`;};
  let ticks='';for(let i=0;i<12;i++){const r=i*30*Math.PI/180;const a=i%3===0?44:48;ticks+=`<line x1="${(60+a*Math.sin(r)).toFixed(1)}" y1="${(60-a*Math.cos(r)).toFixed(1)}" x2="${(60+53*Math.sin(r)).toFixed(1)}" y2="${(60-53*Math.cos(r)).toFixed(1)}" stroke="currentColor" stroke-width="${i%3===0?3:1.6}"/>`;}
  return `<svg class="clock" viewBox="0 0 120 120" width="132" height="132" role="img" aria-label="${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}"><circle cx="60" cy="60" r="57" fill="var(--surface)" stroke="currentColor" stroke-width="3"/>${ticks}${hand(ha,28,5)}${hand(ma,42,3)}<circle cx="60" cy="60" r="4" fill="var(--sun)"/></svg>`;}

function answered(it,v){switch(it.type){
  case 'gap':case 'dictation':return !!norm(v);
  case 'order':return Array.isArray(v)&&v.length===it.words.length;
  case 'match':return !!v&&Object.keys(v.m||{}).length===it.pairs.length;
  case 'sort':return !!v&&Object.keys(v).length===it.words.length;
  case 'write':return !!v&&!!v.sent;
  default:return v!=null;}}
function isOk(it,v){switch(it.type){
  case 'gap':return it.a.some(x=>norm(x)===norm(v));
  case 'dictation':return norm(v)===norm(it.say);
  case 'order':return Array.isArray(v)&&norm(v.map(k=>it.words[k]).join(' '))===norm(it.a);
  case 'tf':return v===(it.a?0:1);
  case 'clock':return v===clockOpts(it).a;
  case 'match':return answered(it,v)&&(v.err||0)<=1;
  case 'sort':return !!v&&it.words.every((w,i)=>v[i]===w[1]);
  case 'speak':case 'write':return answered(it,v);
  default:return v===it.a;}}
function answerText(it){switch(it.type){
  case 'gap':return it.a[0];case 'order':return it.a;case 'dictation':return it.say;case 'tf':return t('tfOpts')[it.a?0:1];

  case 'speak':return it.text;case 'write':return it.model||'';default:return it.opts[it.a];}}

const canSpeak='speechSynthesis' in window;
function speak(text,onend){
  if(!canSpeak){toast(t('noAudio'));if(onend)setTimeout(onend,2200);return;}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='nl-NL';u.rate=.88;
    const v=speechSynthesis.getVoices().find(v=>/^nl/i.test(v.lang));if(v)u.voice=v;
    u.onend=()=>{if(onend)onend();};u.onerror=()=>{if(onend)onend();};speechSynthesis.speak(u);}
  catch(e){toast(t('noAudio'));}
}

/* ---------- flashcards ---------- */
function vCards(deckId,words){
  const fc=S.fc[deckId]||(S.fc[deckId]={i:0,flip:false});
  if(!words.length)return `<div class="card"><p class="muted">${esc(deckId==='review'?t('reviewDone'):t('noItems'))}</p></div>`;
  const dots=`<div class="dots" aria-hidden="true">${words.map((w,i)=>`<i class="${S.known[w[0]]?'k':''} ${i===fc.i?'c':''}"></i>`).join('')}</div>`;
  const knownN=words.filter(w=>S.known[w[0]]).length;
  if(fc.i>=words.length)return `<div class="card-wrap"><div class="flash back">${ring(knownN/words.length,130,12,'var(--mint)',`${knownN}/${words.length}`,esc(t('knownN')))}<h3>${esc(t('deckDone'))}</h3><button class="btn btn-ghost" data-act="fc-restart" data-deck="${deckId}">${esc(t('deckRestart'))}</button></div>${dots}</div>`;

   ${fc.flip?`<div class="flash back"><span class="w">${esc(w[0])}</span><span class="tr">${esc(w[1])}</span><span class="ex">${esc(w[2]||'')}</span>${w[2]?say(w[2]):''}</div>`
     :`<div class="flash">${say(w[0],null,true)}<span class="w">${esc(w[0])}</span><button class="btn btn-ghost" data-act="fc-flip" data-deck="${deckId}">${esc(t('flip'))}</button></div>`}

}

/* ---------- one exercise (question card) ---------- */
function exBody(lid,it,i,fbOn){
  const st=exS(lid).items[i]||{};const v=st.v;const dis=fbOn?'disabled':'';
  const choice=(opts,correct,inline)=>`<div class="opts ${inline?'inline':''}">${opts.map((o,k)=>{let c=v===k?'sel':'';if(fbOn){if(k===correct)c='right';else if(v===k)c='wrong';}return `<button class="opt ${c}" data-act="ans" data-l="${lid}" data-i="${i}" data-o="${k}" ${dis} aria-pressed="${v===k}">${esc(o)}</button>`}).join('')}</div>`;
  switch(it.type){
   case 'mc':return `<p class="q">${esc(it.q)}</p>`+choice(it.opts,it.a);
   case 'listen':return `<div class="say-row">${say(it.say,'?',true)}${!canSpeak?`<em class="muted">„${esc(it.say)}”</em>`:`<span class="muted">${esc(t('hints').listen)}</span>`}</div>`+choice(it.opts,it.a);
   case 'tf':return `<p class="q">${esc(it.q)}</p>`+choice(t('tfOpts'),it.a?0:1);
   case 'clock':{const co=clockOpts(it);return `${it.q?`<p class="q">${esc(it.q)}</p>`:''}<div class="clockwrap"><span class="clock">${clockSvg(it.h,it.m)}</span><div style="flex:1;min-width:220px">${choice(co.opts,co.a)}</div></div>`;}
   case 'gap':return `<div class="gapline"><span>${esc(it.before)}</span><input id="gap-${lid}-${i}" aria-label="${esc(t('hints').gap)}" data-val="${lid}|${i}" value="${esc(v||'')}" autocomplete="off" autocapitalize="off" ${dis}><span>${esc(it.after)}</span></div>`;
   case 'dictation':return `<div class="say-row">${say(it.say,'?',true)}${!canSpeak?`<em class="muted">„${esc(it.say)}”</em>`:''}<input class="dict" id="dict-${lid}-${i}" aria-label="${esc(t('hints').dictation)}" data-val="${lid}|${i}" value="${esc(v||'')}" autocomplete="off" ${dis}></div>`;
   case 'order':{const vv=v||[];return `<div class="built" aria-label="${esc(t('hints').order)}">${vv.map((kk,p)=>`<button class="wchip" data-act="ob" data-l="${lid}" data-i="${i}" data-p="${p}" ${dis}>${esc(it.words[kk])}</button>`).join('')}</div>
    <div class="pool">${it.words.map((w,kk)=>vv.includes(kk)?'':`<button class="wchip" data-act="ow" data-l="${lid}" data-i="${i}" data-k="${kk}" ${dis}>${esc(w)}</button>`).join('')}</div>`;}
   case 'match':{const mv=v||{m:{},sel:null,err:0};const order=perm(it.pairs.length);const done=Object.keys(mv.m);
    return `<div class="match"><div class="mcol">${it.pairs.map((p,kk)=>`<button class="mitem ${done.includes(String(kk))?'right':''} ${mv.sel===kk?'sel':''}" data-act="mL" data-l="${lid}" data-i="${i}" data-k="${kk}" ${done.includes(String(kk))?'disabled':''}>${esc(p[0])}</button>`).join('')}</div>
      <div class="mcol">${order.map(kk=>{const used=Object.values(mv.m).includes(kk);return `<button class="mitem ${used?'right':''} ${mv.bad===kk?'wrong':''}" data-act="mR" data-l="${lid}" data-i="${i}" data-k="${kk}" ${used?'disabled':''}>${esc(it.pairs[kk][1])}</button>`}).join('')}</div></div>
      ${mv.err?`<span class="faint num" style="font-size:.86rem">${mv.err} ${esc(t('errors'))}</span>`:''}`;}
   case 'sort':{const svv=v||{};return `<div class="sortlist">${it.words.map((w,kk)=>{const pick=svv[kk];return `<div class="srow"><span class="sw">${pick?`<b>${esc(pick)}</b> `:'<span class="faint">… </span>'}${esc(w[0])}</span><span class="opts inline">${it.cats.map(c=>{let cl=pick===c?'sel':'';if(fbOn){if(c===w[1])cl=pick===c?'right':'';else if(pick===c)cl='wrong';}return `<button class="opt ${cl}" data-act="srt" data-l="${lid}" data-i="${i}" data-k="${kk}" data-c="${esc(c)}" ${dis}>${esc(c)}</button>`}).join('')}</span></div>`}).join('')}</div>`;}
   case 'speak':return `<div class="say-row">${say(it.text,null,true)}<div><div class="big-say">${esc(it.text)}</div>${S.support&&it.uk?`<span class="muted">${esc(it.uk)}</span>`:''}</div></div>
     <div class="opts"><button class="opt ${v===1?'right':''}" data-act="ans" data-l="${lid}" data-i="${i}" data-o="1" aria-pressed="${v===1}">${esc(t('speakGood'))}</button><button class="opt ${v===0?'sel':''}" data-act="ans" data-l="${lid}" data-i="${i}" data-o="0" aria-pressed="${v===0}">${esc(t('speakHard'))}</button></div>
     <p class="faint" style="font-size:.84rem">${esc(t('speakNote'))}</p>`;
   case 'write':{const wv=v||{};const txt=wv.text||'';const n=txt.trim()?txt.trim().split(/\s+/).length:0;const sub=wv.sub&&S.subs.find(s=>s.id===wv.sub);
    return `<p class="q">${esc(it.prompt.nl)}</p>${S.support?`<p class="muted">${esc(it.prompt.uk)}</p>`:''}
     ${wv.sent?`<div class="card flat" style="background:var(--surface-2);white-space:pre-wrap">${esc(txt)}</div><div class="pill p-good" style="align-self:flex-start">${ICO.check} ${esc(t('writeSent'))}</div>${sub&&sub.status==='done'?`<div class="tip">${TI.bulb}<div><strong>${esc(t('teacherFb'))} · ${esc(t('grades')[sub.grade||0])}</strong><span style="display:block;margin-top:2px">${esc(sub.fb||'')}</span></div></div>`:''}<details><summary>${esc(t('modelA'))}</summary><p style="margin-top:8px">${esc(it.model)}</p></details>`
     :`<textarea class="write-box" id="wr-${lid}-${i}" data-write="${lid}|${i}" aria-label="${esc(t('hints').write)}">${esc(txt)}</textarea>
     <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="btn btn-primary" data-act="wsend" data-l="${lid}" data-i="${i}">${esc(t('writeSend'))}</button><span class="faint num wcount" style="font-size:.86rem;font-weight:700">${n} ${esc(t('wordsN'))} · ${esc(t('minWords'))} ${it.min}</span></div>`}`;}
  }return '';
}

/* ---------- step-by-step exercises ---------- */
function stepState(l){const e=exS(l.id);if(e.step==null)e.step=0;return e;}
function vSteps(l){
  const test=l.type==='test';const e=stepState(l);const n=l.items.length;
  if(!n)return `<div class="card"><p class="muted">${esc(t('noItems'))}</p></div>`;
  const okAt=i=>isOk(l.items[i],(e.items[i]||{}).v);
  const bar=`<div class="pbar" aria-label="${e.step}/${n}">${l.items.map((it,i)=>{const s=e.items[i]||{};let c='';if(i<e.step||(test&&e.submitted)){c=test&&!e.submitted?'cur':(['speak','write'].includes(it.type)?'done':okAt(i)?'done':'bad');}else if(i===e.step)c='cur';return `<i class="${c}"></i>`}).join('')}</div>`;
  if(e.step>=n||(test&&e.submitted)){
    const okN=l.items.filter((it,i)=>okAt(i)).length;const pct=Math.round(okN/n*100);const pass=pct>=70;
    return {bar,body:`<div class="summary">${ring(pct/100,150,14,test&&!pass?'var(--sun)':'var(--mint)',pct+'%',esc(t('scoreN')))}
      <h2>${esc(test?(pass?t('pass'):t('fail')):t('sumT'))}</h2>
      <div class="stats3"><div><b>${okN}/${n}</b><span class="faint">${esc(t('correctN'))}</span></div><div><b>${l.min}</b><span class="faint">${esc(t('minN'))}</span></div><div><b>${S.streak}</b><span class="faint">${esc(t('streakT'))}</span></div></div>
      <div class="ctas" style="justify-content:center"><button class="btn btn-ghost btn-lg" data-act="retry" data-l="${l.id}">${esc(test?t('retry'):t('againB'))}</button>${!test||pass?`<button class="btn btn-primary btn-lg" data-act="finish" data-id="${l.id}">${esc(t('finish'))} ${ICO.arrow}</button>`:''}</div>
      <div class="review-list"><span class="label" style="margin:10px 0 4px">${esc(t('yourAns'))}</span>${l.items.map((it,i)=>{const ok=okAt(i);return `<div class="rl ${ok?'ok':'bad'}"><span class="d">${ok?ICO.check:ICO.x}</span><div><strong>${esc(t('exName')[it.type])}</strong>${it.q||it.say||it.text?` · <span class="muted">${esc(it.q||it.say||it.text)}</span>`:''}${ok?'':`<div style="font-size:.9rem;margin-top:2px"><span class="faint">${esc(t('rightIs'))}</span> <strong>${esc(answerText(it))}</strong></div>`}</div></div>`}).join('')}</div></div>`,fbar:''};
  }
  const i=e.step,it=l.items[i],st=e.items[i]||{};
  const ans=answered(it,st.v);
  const showFb=!test&&st.checked&&!['speak','write'].includes(it.type);
  const ok=showFb&&okAt(i);
  let fbar;
  if(showFb){const g=t('great');fbar=`<div class="fbar ${ok?'ok':'bad'}" role="status"><div class="msg"><span class="bubble-ic">${ok?ICO.check:ICO.x}</span><div>${esc(ok?g[i%g.length]:t('notQ'))}${ok?'':`<small>${esc(t('rightIs'))} ${esc(answerText(it))}</small>`}</div></div><button class="btn ${ok?'btn-mint':'btn-bad'} btn-lg" data-act="stepnext" data-l="${l.id}">${esc(t('cont2'))}</button></div>`;}
  else if(['speak','write'].includes(it.type)){fbar=`<div class="fbar"><span class="faint" style="font-weight:700">${i+1} / ${n}</span><button class="btn btn-primary btn-lg" data-act="stepnext" data-l="${l.id}" ${ans?'':'aria-disabled="true"'}>${esc(t('cont2'))}</button></div>`;}
  else if(test){const last=i===n-1;fbar=`<div class="fbar"><span class="faint" style="font-weight:700">${i+1} / ${n}</span><div class="ctas">${i>0?`<button class="btn btn-ghost" data-act="stepback" data-l="${l.id}">${esc(t('prev'))}</button>`:''}<button class="btn btn-primary btn-lg" data-act="${last?'submit-test':'stepnext'}" data-l="${l.id}" ${ans?'':'aria-disabled="true"'}>${esc(last?t('submit'):t('nextQ'))}</button></div></div>`;}
  else fbar=`<div class="fbar"><button class="btn btn-quiet" data-act="stepskip" data-l="${l.id}">${esc(t('skipB'))}</button><button class="btn btn-primary btn-lg" data-act="stepcheck" data-l="${l.id}" ${ans?'':'aria-disabled="true"'}>${esc(t('checkB'))}</button></div>`;
  return {bar,body:qCard(l.id,it,i,showFb),fbar};
}

/* ---------- grammar & reading ---------- */
function vGrammar(l){
  const ukCol=(l.head||[]).indexOf('Українською');const cols=(l.head||[]).map((h,i)=>i).filter(i=>S.support||i!==ukCol);
  const sayTxt=r=>l.head&&l.head[1]==='zijn'?`${r[0].split(' / ')[0]} ${r[1]}. ${r[0].split(' / ')[0]} ${r[2]}.`:(r[1]||r[0]);

const DEF_ITEM={
  mc:()=>({type:'mc',q:'Ik ___ in Utrecht.',opts:['woon','woont','wonen'],a:0}),
  listen:()=>({type:'listen',say:'de huisarts',opts:['сімейний лікар','аптека','лікарня'],a:0}),
  tf:()=>({type:'tf',q:'Utrecht ligt in Nederland.',a:true}),
  gap:()=>({type:'gap',before:'Ik woon',after:'Utrecht.',a:['in']}),
  order:()=>({type:'order',words:['Utrecht','woon','in','Ik'],a:'Ik woon in Utrecht'}),
  match:()=>({type:'match',pairs:[['het huis','будинок'],['de straat','вулиця'],['de stad','місто']]}),
  dictation:()=>({type:'dictation',say:'Ik woon in Utrecht.'}),
  sort:()=>({type:'sort',cats:['de','het'],words:[['huis','het'],['straat','de'],['stad','de'],['station','het']]}),
  clock:()=>({type:'clock',h:14,m:30,q:'Hoe laat is het?'}),
  speak:()=>({type:'speak',text:'Ik wil graag een afspraak maken.',uk:'Я хотів(ла) б записатися на прийом.'}),
  write:()=>({type:'write',prompt:{nl:'Schrijf 3 zinnen over je werk.',uk:'Напишіть 3 речення про свою роботу.'},model:'Ik werk in een magazijn. Ik begin om acht uur. Mijn collega’s zijn aardig.',min:12})
};
const ITEM_TYPES_FOR={practice:EXTYPES,test:EXTYPES.filter(x=>!['speak','write'].includes(x)),reading:['tf','mc','gap','match'],speaking:['speak','listen','dictation'],writing:['write']};
const shuffleWords=s=>{const w=s.replace(/[.?!]$/,'').split(/\s+/).filter(Boolean);if(w.length<2)return w;const r=w.slice(1).concat(w[0]);return r.length>3?[r[1],r[0],...r.slice(2)]:r.reverse();};
const lines2=(v,sep)=>v.split('\n').map(x=>x.split(sep).map(y=>y.trim())).filter(r=>r[0]);

function itemFields(it,i){
  const F=(key,label,val,ta)=>`<div class="field"><label for="bf-${i}-${key}">${esc(label)}</label>${ta?`<textarea id="bf-${i}-${key}" data-bi="${i}|${key}" rows="${ta}">${esc(val)}</textarea>`:`<input id="bf-${i}-${key}" data-bi="${i}|${key}" value="${esc(val)}">`}</div>`;
  switch(it.type){
   case 'mc':return F('q',t('fq'),it.q)+F('opts',t('fopts'),it.opts.join('\n'),3)+F('aN',t('fa'),it.a+1);
   case 'listen':return F('say',t('fsay'),it.say)+F('opts',t('fopts'),it.opts.join('\n'),3)+F('aN',t('fa'),it.a+1);
   case 'tf':return F('q',t('fq'),it.q)+`<div class="field"><label for="bf-${i}-tf">${esc(t('ftf'))}</label><select id="bf-${i}-tf" data-bi="${i}|tfA"><option value="1" ${it.a?'selected':''}>${esc(t('tfOpts')[0])}</option><option value="0" ${!it.a?'selected':''}>${esc(t('tfOpts')[1])}</option></select></div>`;
   case 'gap':return `<div class="grid g3" style="gap:10px">${F('before',t('fbefore'),it.before)+F('answers',t('fanswers'),it.a.join(', '))+F('after',t('fafter'),it.after)}</div>`;
   case 'order':return F('sentence',t('fsentence'),it.a);
   case 'match':return F('pairs',t('fpairs'),it.pairs.map(p=>p.join(' = ')).join('\n'),4);
   case 'dictation':return F('say',t('fsay'),it.say);
   case 'sort':return F('cats',t('fcats'),it.cats.join(', '))+F('swords',t('fswords'),it.words.map(w=>w.join(' = ')).join('\n'),4);
   case 'clock':return F('q',t('fq'),it.q||'')+`<div class="grid g2" style="gap:10px"><div class="field"><label for="bf-${i}-h">${esc(t('fh'))}</label><input id="bf-${i}-h" type="number" min="0" max="23" data-bi="${i}|h" value="${it.h}"></div><div class="field"><label for="bf-${i}-m">${esc(t('fm'))}</label><select id="bf-${i}-m" data-bi="${i}|m">${Array.from({length:12},(_,k)=>k*5).map(m=>`<option value="${m}" ${it.m===m?'selected':''}>${String(m).padStart(2,'0')} · ${esc(dutchTime(it.h,m))}</option>`).join('')}</select></div></div>`;
   case 'speak':return F('text',t('ftext'),it.text)+F('uk',t('fuk'),it.uk||'');
   case 'write':return F('promptNl',t('fpromptNl'),it.prompt.nl,2)+F('promptUk',t('fpromptUk'),it.prompt.uk,2)+F('model',t('fmodel'),it.model,3)+F('min',t('fminw'),it.min);
  }return '';
}
function setItem(it,key,val){
  switch(key){
   case 'opts':it.opts=val.split('\n').map(s=>s.trim()).filter(Boolean);if(it.a>=it.opts.length)it.a=0;break;
   case 'aN':it.a=Math.max(0,Math.min((it.opts||[]).length-1,(parseInt(val,10)||1)-1));break;
   case 'tfA':it.a=val==='1';break;
   case 'answers':it.a=val.split(',').map(s=>s.trim()).filter(Boolean);break;
   case 'sentence':it.a=val.trim().replace(/[.?!]$/,'');it.words=shuffleWords(it.a);break;
   case 'pairs':it.pairs=lines2(val,'=').filter(r=>r[1]).map(r=>[r[0],r[1]]);break;
   case 'cats':it.cats=val.split(',').map(s=>s.trim()).filter(Boolean);break;
   case 'swords':it.words=lines2(val,'=').filter(r=>r[1]).map(r=>[r[0],r[1]]);break;
   case 'h':it.h=Math.max(0,Math.min(23,parseInt(val,10)||0));break;
   case 'm':it.m=parseInt(val,10)||0;break;
   case 'min':it.min=parseInt(val,10)||0;break;
   case 'promptNl':it.prompt.nl=val;break;case 'promptUk':it.prompt.uk=val;break;
   default:it[key]=val;}
}
function lessonFields(l){
  const F=(key,label,val,ta)=>`<div class="field"><label for="bl-${key}">${esc(label)}</label>${ta?`<textarea id="bl-${key}" data-bl="${key}" rows="${ta}">${esc(val)}</textarea>`:`<input id="bl-${key}" data-bl="${key}" value="${esc(val)}">`}</div>`;
  if(l.type==='words')return F('words',t('fwordsL'),(l.words||[]).map(w=>w.join(' | ')).join('\n'),8);
  if(l.type==='video')return F('scene',t('fscene'),L(l.scene)||(l.scene&&l.scene.nl)||'')+F('lines',t('flines'),(l.lines||[]).map(w=>w.join(' | ')).join('\n'),8);
  if(l.type==='grammar')return F('introNl',t('fintroNl'),(l.intro||{}).nl||'',2)+F('introUk',t('fintroUk'),(l.intro||{}).uk||'',2)+F('rows',t('frows'),[l.head||[],...(l.rows||[])].map(r=>r.join(' | ')).join('\n'),6)+F('tips',t('ftips'),(l.tips||[]).map(x=>`${x.nl} | ${x.uk}`).join('\n'),3);
  if(l.type==='reading')return F('ttitle',t('ftextT'),(l.text||{}).title||'')+F('paras',t('ftextP'),((l.text||{}).paras||[]).map(p=>p.join(' | ')).join('\n'),6);
  return '';
}
function setLesson(l,key,val){
  switch(key){
   case 'titleNl':l.title.nl=val;break;case 'titleUk':l.title.uk=val;break;case 'min':l.min=parseInt(val,10)||1;break;
   case 'words':l.words=lines2(val,'|');break;
   case 'scene':l.scene={nl:val,uk:val};break;case 'lines':l.lines=lines2(val,'|').filter(r=>r[1]);break;
   case 'introNl':(l.intro=l.intro||{nl:'',uk:''}).nl=val;break;case 'introUk':(l.intro=l.intro||{nl:'',uk:''}).uk=val;break;
   case 'rows':{const r=lines2(val,'|');l.head=r[0]||[];l.rows=r.slice(1);break;}
   case 'tips':l.tips=lines2(val,'|').map(r=>({nl:r[0],uk:r[1]||''}));break;
   case 'ttitle':(l.text=l.text||{title:'',paras:[]}).title=val;break;case 'paras':(l.text=l.text||{title:'',paras:[]}).paras=lines2(val,'|');break;
  }
}
function newLessonObj(type){const base={id:'L'+Date.now().toString(36),type,min:10,title:{nl:t('newLesson'),uk:''},status:'draft'};
  if(type==='words')base.words=[['het voorbeeld','приклад','Dit is een voorbeeld.']];
  else if(type==='video'){base.scene={nl:'',uk:''};base.lines=[['A','Hallo!','Привіт!'],['B','Hoi, hoe gaat het?','Привіт, як справи?']];}
  else if(type==='grammar'){base.intro={nl:'',uk:''};base.head=['','',''];base.rows=[];base.tips=[];}
  else if(type==='reading'){base.text={title:'',paras:[]};base.items=[];}
  else base.items=[];
  return base;}
function generateFrom(srcId){const src=findL(srcId);if(!src||!src.words||!src.words.length)return [];const w=src.words;const out=[];
  out.push({type:'match',pairs:w.slice(0,5).map(x=>[x[0],x[1]])});
  w.slice(0,3).forEach((x,k)=>{const others=w.filter(y=>y!==x).slice(k,k+2).map(y=>y[1]);if(others.length===2)out.push({type:'listen',say:x[0],opts:[x[1],...others],a:0});});
  w.filter(x=>x[2]).slice(0,2).forEach(x=>out.push({type:'dictation',say:x[2]}));
  w.filter(x=>x[2]).forEach(x=>{const bare=x[0].replace(/^(de|het)\s+/,'');const ix=x[2].toLowerCase().indexOf(bare.toLowerCase());if(ix>0&&out.filter(o=>o.type==='gap').length<2){out.push({type:'gap',before:x[2].slice(0,ix).trim(),after:x[2].slice(ix+bare.length).trim(),a:[bare]});}});
  const art=w.filter(x=>/^(de|het)\s/.test(x[0]));if(art.length>=3)out.push({type:'sort',cats:['de','het'],words:art.slice(0,6).map(x=>[x[0].replace(/^(de|het)\s+/,''),x[0].split(' ')[0]])});
  return out;}

let courseVer=0,courseTimer=0,courseSnap='',courseReady=false;
function syncCourseSoon(){
  if(!isStaff()||!courseReady||!S.course||JSON.stringify(S.course)===courseSnap)return;
  clearTimeout(courseTimer);
  courseTimer=setTimeout(async()=>{
    const body=JSON.stringify(S.course);if(body===courseSnap)return;
    try{const r=await api('/course',{method:'PUT',body:JSON.stringify({course:S.course,baseVersion:courseVer})});
      if(r.ok){courseVer=r.json.version;courseSnap=body;}
      else if(r.status===409){await loadCourse();render();toast(t('courseConflict'));}
      else if(r.status===403){toast(t('courseNoRight'));}
      else{toast(t('courseSaveFail'));}
    }catch(e){}
  },1500);
}
async function loadCourse(){
  courseReady=false;
  const r=await api('/course');
  if(r.ok&&r.json){
    courseVer=r.json.version;
    if(r.json.course){S.course=r.json.course;courseSnap=JSON.stringify(S.course);try{ensureLearn()}catch(e){}
      try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

    if(!r.json.course&&isStaff())syncCourseSoon();
  }
}

async function loadSubs(){
  const r=await api('/submissions');if(!r.ok||!r.json)return false;
  const local=new Map(S.subs.map(x=>[x.id,x]));
  const list=r.json.submissions.map(x=>{const old=local.get(x.id);
    const o={id:x.id,lid:x.lessonId,who:x.who,text:x.text,status:x.status,grade:x.grade==null?undefined:x.grade,fb:x.feedback||undefined,mine:String(x.userId)===String(ACCOUNT.id),idx:x.itemIdx};
    if(old&&x.status==='new'){if(old.grade!=null)o.grade=old.grade;if(old.fb)o.fb=old.fb;} /* не затираем черновик отзыва преподавателя */
    return o;});
  const sig=JSON.stringify(list.map(x=>[x.id,x.status,x.grade,x.fb]));
  const changed=sig!==subSig;subSig=sig;S.subs=list;
  /* состояние «сдано» у ученика берём из его работ на сервере; демо-запись s1 убираем */
  const ids=new Set(list.map(x=>x.id));
  for(const lid in S.ex){const its=(S.ex[lid]||{}).items||{};for(const i in its){const v=its[i]&&its[i].v;if(v&&v.sub==='s1'&&!ids.has('s1'))delete its[i];}}
  for(const x of list)if(x.mine){const idx=x.idx;const e2=exS(x.lid);const st=(e2.items[idx]=e2.items[idx]||{});
    if(!st.v||!st.v.sent||st.v.sub!==x.id)st.v={text:x.text,sent:true,sub:x.id};}
  return changed;
}
async function sendSubmission(tmpId,lid,idx,text){
  try{const r=await api('/submissions',{method:'POST',body:JSON.stringify({lessonId:lid,itemIdx:idx,text})});
    if(r.ok&&r.json&&r.json.id){const sub=S.subs.find(x=>x.id===tmpId);if(sub){sub.id=r.json.id;sub.idx=idx;}
      const st=((S.ex[lid]||{}).items||{})[idx];if(st&&st.v&&st.v.sub===tmpId)st.v.sub=r.json.id;save();render();return;}
    if(r.status===409){await loadSubs();render();return;}
  }catch(e){}
  S.subs=S.subs.filter(x=>x.id!==tmpId);const st=((S.ex[lid]||{}).items||{})[idx];if(st&&st.v&&st.v.sub===tmpId)st.v={text};
  save();render();toast(t('subFail'));
}
async function gradeSubmission(s){
  try{const r=await api('/submissions/'+encodeURIComponent(s.id),{method:'PATCH',body:JSON.stringify({grade:s.grade,feedback:s.fb||''})});if(r.ok)return;}catch(e){}
  s.status='new';save();render();toast(t('gradeFail'));
}

/* ---------- placement test (adaptive; questions and scoring live on the server) ---------- */
const PL_KEY='taalbrug-placement-token';
let PL={phase:'intro',sel:null,busy:false};
const plRecModule=lvl=>C().find(m=>m.lvl===lvl&&!m.soon)||null;
function vPlacement(){
  let inner='';
  if(PL.phase==='intro'||PL.phase==='error'){
    inner=`<div class="card" style="max-width:680px;margin:0 auto;padding:36px;display:flex;flex-direction:column;gap:18px">
      <span class="label">${esc(t('plCta'))}</span><h1 style="font-size:clamp(1.8rem,4vw,2.5rem)">${esc(t('plT'))}</h1><p class="muted" style="font-size:1.05rem">${esc(t('plLead'))}</p>
      <ul style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px">${t('plPoints').map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
      ${PL.phase==='error'?`<p class="err" role="alert">${esc(t('plErr'))}</p>`:''}
      <div class="ctas"><button class="btn btn-primary btn-lg" data-act="pl-start" ${PL.busy?'disabled':''}>${esc(t('plStart'))} ${ICO.arrow}</button><button class="btn btn-ghost btn-lg" data-go="${ACCOUNT?'learner':'home'}">${esc(t('plBack'))}</button></div></div>`;
  }else if(PL.phase==='q'&&PL.q){
    const q=PL.q,pct=Math.min(100,Math.round((PL.n-1)/PL.max*100));
    inner=`<div class="card" style="max-width:680px;margin:0 auto;padding:32px;display:flex;flex-direction:column;gap:18px">
      <div><div style="display:flex;justify-content:space-between;font-weight:700;font-size:.9rem;margin-bottom:8px"><span>${esc(t('plQ'))} ${PL.n}</span><span class="faint">${esc(t('plT'))}</span></div>
        <div style="height:8px;border-radius:99px;background:var(--line-2);overflow:hidden" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="display:block;height:100%;width:${pct}%;background:var(--iris);transition:width .3s"></i></div></div>
      ${q.type==='listen'?`<div class="say-row">${say(q.say,'?',true)}${!canSpeak?`<em class="muted">„${esc(q.say)}”</em>`:''}</div>`:''}
      <h2 class="q" style="font-size:1.35rem">${esc(q.prompt.nl)}</h2>${S.support?`<p class="muted">${esc(q.prompt.uk)}</p>`:''}
      <div class="opts" role="group" aria-label="${esc(q.prompt.nl)}">${q.options.map((o,i)=>`<button class="opt ${PL.sel===i?'sel':''}" data-act="pl-pick" data-i="${i}" aria-pressed="${PL.sel===i}">${esc(o)}</button>`).join('')}</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center"><button class="btn btn-primary" data-act="pl-next" ${PL.busy?'disabled':''}>${esc(t('plNext'))}</button><button class="btn btn-quiet" data-act="pl-dont" ${PL.busy?'disabled':''}>${esc(t('plDont'))}</button></div></div>`;
  }else if(PL.phase==='result'&&PL.result){
    const r=PL.result,m=plRecModule(r.level);
    inner=`<div class="card" style="max-width:680px;margin:0 auto;padding:36px;display:flex;flex-direction:column;gap:16px">
      <span class="label">${esc(t('plRes'))}</span><h1 style="font-size:clamp(2.4rem,6vw,3.6rem)">${esc(r.level)}</h1><p style="font-size:1.1rem">${esc(t('plLvl')[r.level])}</p>
      <p class="muted num">${r.correct}/${r.total} ${esc(t('plRight'))}</p>
      <div class="tip">${TI.bulb}<div><strong>${m?esc(t('plRec'))+' '+esc(m.lvl)+' · '+esc(L(m.title)):esc(t('plNoRec'))}</strong></div></div>
      ${!ACCOUNT&&API_UP?`<div class="card flat" style="background:var(--surface-2);display:flex;flex-direction:column;gap:10px"><h3>${esc(t('plSaveT'))}</h3><p class="muted">${esc(t('plSaveB'))}</p><div><button class="btn btn-primary" data-act="login-open">${esc(t('login'))}</button></div></div>`:''}
      <div class="ctas"><button class="btn btn-primary btn-lg" data-go="learner">${esc(t('plGo'))} ${ICO.arrow}</button><button class="btn btn-ghost btn-lg" data-act="pl-start">${esc(t('plAgain'))}</button></div></div>`;
  }
  return mShell(`<section style="padding:24px 0 48px">${inner}</section>`);
}
async function plStart(){
  PL={phase:'intro',sel:null,busy:true};render();
  try{const r=await api('/placement/start',{method:'POST',body:'{}'});
    if(!r.ok||!r.json||!r.json.question)throw new Error('start');
    try{localStorage.setItem(PL_KEY,r.json.token)}catch(e){}
    PL={phase:'q',token:r.json.token,n:r.json.n,max:r.json.max,q:r.json.question,sel:null,busy:false};
  }catch(e){PL={phase:'error',sel:null,busy:false};}
  render();window.scrollTo(0,0);
}
async function plSubmit(choice){
  if(PL.busy||!PL.q)return;PL.busy=true;render();
  try{const r=await api('/placement/answer',{method:'POST',body:JSON.stringify({token:PL.token,n:PL.n,choice})});
    if(r.status===409&&r.json&&r.json.n){const rs=await api('/placement/resume',{method:'POST',body:JSON.stringify({token:PL.token})});
      if(rs.ok&&rs.json&&rs.json.question){PL.n=rs.json.n;PL.q=rs.json.question;PL.sel=null;PL.busy=false;render();return;}}
    if(!r.ok||!r.json)throw new Error('answer');
    if(r.json.done){PL={phase:'result',result:r.json.result,token:PL.token,sel:null,busy:false};S.placed=r.json.result.level;save();
      if(ACCOUNT)claimPlacement();}
    else{PL.n=r.json.n;PL.max=r.json.max;PL.q=r.json.question;PL.sel=null;PL.busy=false;}
  }catch(e){PL.busy=false;toast(t('plErr'));}
  render();window.scrollTo(0,0);
}
async function claimPlacement(){
  let tok=null;try{tok=localStorage.getItem(PL_KEY)}catch(e){}
  if(tok){try{const r=await api('/placement/claim',{method:'POST',body:JSON.stringify({token:tok})});if(r.ok||r.status===404){localStorage.removeItem(PL_KEY);}}catch(e){}}
  try{const m=await api('/me/placement');if(m.ok&&m.json&&m.json.result&&m.json.result.level&&m.json.result.level!==S.placed){S.placed=m.json.result.level;save();render();}}catch(e){}
}
const SYNC_KEYS=['done','scores','known','fc','ex','cur','week','streak'];
let API_UP=false,loginState='form',loginEmail='',syncTimer=0,syncReady=false;
const api=async(path,opt)=>{const r=await fetch('/api'+path,Object.assign({credentials:'same-origin',headers:{'content-type':'application/json'}},opt));
  let j=null;try{j=await r.json()}catch(e){}return {ok:r.ok,status:r.status,json:j};};
function accountBlock(){
  if(!API_UP)return '';
  if(ACCOUNT)return `<div class="muted" style="font-size:.82rem;overflow-wrap:anywhere">${esc(ACCOUNT.email)}</div><button class="btn btn-quiet btn-sm" data-act="logout" style="justify-content:flex-start">${esc(t('logout'))}</button>`;
  return `<button class="btn btn-primary btn-sm" data-act="login-open" style="justify-content:center">${esc(t('login'))}</button>`;
}
function loginSheet(msg){
  const inner=loginState==='sent'
    ?`<h2>${esc(t('loginSentT'))}</h2><p>${esc(t('loginSentB'))} <b>${esc(loginEmail)}</b>.</p><p class="muted">${esc(t('loginSentN'))}</p><div><button class="btn btn-primary" data-act="close-ov">${esc(t('close'))}</button></div>`
    :`<h2>${esc(t('loginT'))}</h2><p class="muted">${esc(t('loginLead'))}</p>
      <form id="login-form" novalidate style="display:flex;flex-direction:column;gap:14px"><div class="field"><label for="login-email">${esc(t('email'))}</label>
      <input id="login-email" name="email" type="email" autocomplete="email" inputmode="email" required value="${esc(loginEmail)}"></div>
      ${msg?`<p class="err" role="alert">${esc(msg)}</p>`:''}
      <div style="display:flex;gap:10px"><button class="btn btn-primary" type="submit">${esc(t('loginSend'))}</button><button class="btn btn-quiet" type="button" data-act="close-ov">${esc(t('close'))}</button></div></form>`;
  return `<div class="overlay" data-act="close-ov"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(t('loginT'))}">${inner}</div></div>`;
}
function syncSoon(){
  if(!ACCOUNT||!syncReady)return;clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>{const data={};for(const k of SYNC_KEYS)if(S[k]!==undefined)data[k]=S[k];
    api('/me/progress',{method:'PUT',body:JSON.stringify({data})}).catch(()=>{});},1200);
}
async function loadProgress(){
  const r=await api('/me/progress');syncReady=false;
  if(r.ok&&r.json&&r.json.data){Object.assign(S,r.json.data);try{ensureLearn()}catch(e){}try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
  syncReady=true;
  if(r.ok&&r.json&&!r.json.data)syncSoon(); /* first login: upload what was done locally */
}
async function logout(){try{await api('/auth/logout',{method:'POST',body:'{}'})}catch(e){}
  ACCOUNT=null;syncReady=false;courseReady=false;overlay='';S.subs=null;subSig='';try{ensureLearn()}catch(e){}render();toast(t('loggedOut'));}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='login-form')return;e.preventDefault();
  const email=String(new FormData(e.target).get('email')||'').trim();loginEmail=email;
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){overlay=loginSheet(t('loginBad'));render();return;}
  try{const r=await api('/auth/request',{method:'POST',body:JSON.stringify({email})});
    if(r.ok){loginState='sent';overlay=loginSheet();}else overlay=loginSheet(t(r.status===400?'loginBad':'loginFail'));}
  catch(err){overlay=loginSheet(t('loginFail'));}
  render();
});
async function bootstrapAccount(){
  try{const hp=await api('/health');API_UP=hp.ok&&!!(hp.json&&hp.json.ok);}catch(e){API_UP=false;}
  if(!API_UP)return;
  const u=new URL(location.href),tok=u.searchParams.get('login');
  if(tok){u.searchParams.delete('login');try{history.replaceState(null,'',u.pathname+u.search+u.hash)}catch(e){}
    const r=await api('/auth/verify',{method:'POST',body:JSON.stringify({token:tok})});
    toast(t(r.ok?'loginDone':'loginInvalid'));}
  const me=await api('/me');
  if(me.ok&&me.json&&me.json.user){ACCOUNT=me.json.user;await loadProgress();await loadCourse();await loadSubs();await claimPlacement();}
  render();
}

const h=(location.hash||'').slice(1);if(VIEWS[h])S.view=h;
render();
bootstrapAccount();

})();
